name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The floor of the core (PHP ^8.2) and the two versions after it. No PHP extension is required (predis is
    # pure PHP). The tests that need Redis run against the service below; ASPEC_REDIS_REQUIRED=1 makes them
    # fail, instead of being skipped, when it does not answer.
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      ASPEC_REDIS_HOST: 127.0.0.1
      ASPEC_REDIS_PORT: 6379
      ASPEC_REDIS_DATABASE: 15
      ASPEC_REDIS_REQUIRED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
